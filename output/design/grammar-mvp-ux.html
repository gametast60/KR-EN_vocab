  function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

  function save(){if(window.openai&&window.openai.setWidgetState){try{window.openai.setWidgetState({modelContent:{prototype:'grammar-mvp-ux',screen:s.page,lesson:'N + 에서',passedBasics:s.passed,result:s.last},privateContent:{v:1,state:s,design:design}})?.catch(()=>{});}catch(_){}}}
  function restore(payload){const v=payload&&payload.privateContent;if(!v||v.v!==1||!v.state)return;const incoming=v.state;if(!allowedPages.includes(incoming.page))return;s=Object.assign({},defaults,incoming);s.step=Math.max(0,Math.min(2,Number(s.step)||0));s.practice=Math.max(0,Math.min(2,Number(s.practice)||0));s.quiz=Math.max(0,Math.min(9,Number(s.quiz)||0));s.answers=Array.isArray(s.answers)?s.answers.slice(0,10):[];s.detail=Math.max(0,Math.min(15,Number(s.detail)||0));s.attempt=Math.max(0,Math.floor(Number(s.attempt)||0));s.paused=allowedPages.includes(s.paused)?s.paused:null;if(v.design){design.fontSize=Math.min(19,Math.max(15,Number(v.design.fontSize)||16));design.radius=Math.min(24,Math.max(12,Number(v.design.radius)||20));}}

  function learn(){let content='';if(s.step===0){content='<div class="gm-eyebrow">ความหมาย</div><h1>กิจกรรมนี้<br>เกิดขึ้นที่ไหน?</h1><div class="gm-example gm-gap"><p class="gm-korean" lang="ko">'+button('도서관','gloss','gm-word','aria-expanded="'+s.gloss+'"')+'<mark>에서</mark><br>공부해요.</p>'+(s.gloss?'<p class="gm-gloss">도서관 = ห้องสมุด · 공부하다 = เรียน</p>':'')+(s.translation?'<p class="gm-muted gm-gap-sm">เรียนที่ห้องสมุด</p>':'')+'<div class="gm-row gm-gap-sm">'+audio('도서관에서 공부해요.')+'</div></div><p class="gm-rule gm-gap"><strong>에서</strong> ตามหลังชื่อสถานที่<br>เพื่อบอกว่าการกระทำเกิดขึ้นที่นั่น</p>'+(s.extra?'<p class="gm-small gm-gap-sm">บทนี้เรียนเฉพาะความหมาย “สถานที่ทำกิจกรรม” ส่วนความหมาย “จาก” จะเรียนแยกภายหลัง</p>':'')+'<p class="gm-small gm-gap">แตะคำที่ขีดเส้นเพื่อดูความหมายได้</p>';}
  if(s.step===1){content='<div class="gm-eyebrow">วิธีประกอบ</div><h1>ชื่อสถานที่ + 에서</h1><p class="gm-small gm-gap-sm">ใช้ 에서 เหมือนกัน ทั้งคำที่มีและไม่มีตัวสะกด</p><div class="gm-formula gm-gap" lang="ko">장소 + <mark>에서</mark><small>สถานที่ + คำช่วย</small></div><div class="gm-example gm-gap"><p class="gm-korean" lang="ko">집<mark>에서</mark> 공부해요.</p><p class="gm-small">เรียนที่บ้าน · 집 มีตัวสะกด</p></div><div class="gm-example gm-gap-sm"><p class="gm-korean" lang="ko">학교<mark>에서</mark> 운동해요.</p><p class="gm-small">ออกกำลังกายที่โรงเรียน · 학교 ไม่มีตัวสะกด</p></div><p class="gm-rule gm-gap">เขียนติดกับชื่อสถานที่: <strong lang="ko">집에서</strong></p>';}
  if(s.step===2){content='<div class="gm-eyebrow">เปรียบเทียบกับเรื่องที่รู้แล้ว</div><h1>สถานที่เดียวกัน<br>แต่เล่าคนละเรื่อง</h1><div class="gm-stack gm-gap"><div class="gm-example"><p class="gm-small">อยู่ที่ไหน · ตำแหน่ง</p><p class="gm-korean" lang="ko">학교<mark>에</mark> 있어요.</p><p class="gm-small">อยู่ที่โรงเรียน</p></div><div class="gm-example"><p class="gm-small">ไปที่ไหน · จุดหมาย</p><p class="gm-korean" lang="ko">학교<mark>에</mark> 가요.</p><p class="gm-small">ไปโรงเรียน</p></div><div class="gm-example"><p class="gm-small">ทำที่ไหน · สถานที่ทำกิจกรรม</p><p class="gm-korean" lang="ko">학교<mark>에서</mark> 공부해요.</p><p class="gm-small">เรียนที่โรงเรียน</p></div></div>';}
  return studyHeader('เรียนรู้',(s.step+1)+' / 3',(s.step+1)/3*100)+'<main class="gm-content">'+content+'</main>'+footer(button(s.step===2?'ลองฝึกด้วยกัน '+icon('arrow-right'):'ถัดไป '+icon('arrow-right'),s.step===2?'practice-start':'lesson-next','gm-button gm-primary gm-full')+(s.step>0?button('ย้อนกลับ','lesson-back','gm-link') :''));}
  function question(q,isQuiz){let content='<div class="gm-eyebrow">'+(isQuiz?(s.quiz<5?'เข้าใจและเลือกใช้':'สร้างรูปและนำไปใช้'):'ฝึกพร้อมคำแนะนำ')+'</div><h1>'+q.prompt+'</h1><div class="gm-example gm-gap"><p class="gm-korean" lang="ko">'+esc(q.sentence).replace('___','<span class="gm-blank">&nbsp;</span>')+'</p></div>';if(q.type==='choice'){content+='<div class="gm-choices" role="group" aria-label="ตัวเลือกคำตอบ">'+q.options.map((o,i)=>{const judged=!isQuiz&&s.feedback,right=judged&&i===q.answer,wrong=judged&&i===s.selection&&i!==q.answer;return button('<span class="gm-letter">'+(right?'✓':String.fromCharCode(65+i))+'</span><span>'+esc(o)+(right?'<span class="gm-small" style="display:block">คำตอบที่ถูก</span>':'')+'</span>','choose','gm-choice'+(right?' gm-correct':'')+(wrong?' gm-wrong':''),'data-value="'+i+'" aria-pressed="'+(s.selection===i)+'" '+(judged?'disabled':''));}).join('')+'</div>';}else{content+='<label class="gm-field-label" for="gm-answer">คำช่วยภาษาเกาหลี</label><input id="gm-answer" class="gm-answer" lang="ko" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="พิมพ์คำตอบ" value="'+esc(s.draft)+'" '+(!isQuiz&&s.feedback?'disabled':'')+'><p class="gm-small gm-gap-sm">ตอบเฉพาะส่วนที่เว้นว่าง</p>';}
  if(isQuiz){const glossary=[['공원','สวน'],['친구','เพื่อน'],['식당','ร้านอาหาร'],['도서관','ห้องสมุด'],['카페','ร้านกาแฟ'],['학교','โรงเรียน'],['집','บ้าน'],['운동해요','ออกกำลังกาย'],['공부해요','เรียน'],['일해요','ทำงาน'],['읽어요','อ่าน'],['먹어요','กิน'],['가요','ไป'],['있어요','อยู่ / มี'],['지금','ตอนนี้'],['내일','พรุ่งนี้'],['오늘','วันนี้'],['책','หนังสือ'],['밥','ข้าว']].filter(w=>q.sentence.includes(w[0]));content+='<details class="gm-gap"><summary class="cursor-interaction">คำศัพท์ในประโยค</summary><p class="gm-small">'+glossary.map(w=>'<span lang="ko">'+w[0]+'</span> = '+w[1]).join('<br>')+'</p></details>';}
  if(!isQuiz&&s.hint)content+='<p class="gm-note gm-gap" role="status">คำใบ้: '+q.hint+'</p>';if(!isQuiz&&s.feedback){content+='<div class="gm-feedback '+(s.feedback==='correct'?'':'gm-repair')+'" role="status"><h3>'+icon(s.feedback==='correct'?'check':'lightbulb')+' '+(s.feedback==='correct'?'ใช้ได้ตรงความหมาย':'ลองดูความหมายตรงนี้')+'</h3><p>'+q.why+'</p><p class="gm-small gm-gap-sm">ช่วงฝึกใช้คำใบ้และลองผิดได้</p></div>';}return content;}
  function practiceView(){const q=practice[s.practice],ready=q.type==='choice'?s.selection!==null:!!s.draft.trim();return studyHeader('ฝึกพร้อมคำแนะนำ',(s.practice+1)+' / 3',(s.practice+1)/3*100)+'<main class="gm-content">'+question(q,false)+'</main>'+footer(s.feedback?button(s.practice===2?'พร้อมลองด้วยตัวเอง '+icon('arrow-right'):'ข้อถัดไป '+icon('arrow-right'),'practice-next','gm-button gm-primary gm-full'):button('ตรวจคำตอบ','practice-check','gm-button gm-primary gm-full',ready?'':'disabled'))+(!s.feedback?'<div style="padding:0 20px 20px">'+button(icon('lightbulb')+' ขอคำใบ้','hint','gm-link')+'</div>':'');}
  function checkIntro(){return studyHeader('ลองด้วยตัวเอง','10 ข้อ',0)+'<main class="gm-content"><div class="gm-eyebrow">จุดตรวจความเข้าใจ</div><h1>ลองใช้เอง<br>ในประโยคใหม่</h1><p class="gm-muted gm-gap-sm">ไม่จับเวลา ค่อย ๆ คิดได้เต็มที่</p><div class="gm-card gm-gap"><div class="gm-row gm-between"><h3>เข้าใจและเลือกใช้</h3><span class="gm-pill">5 ข้อ</span></div><p class="gm-small">อ่านประโยคแล้วเลือกความหมาย</p><hr class="gm-divider"><div class="gm-row gm-between"><h3>สร้างรูปและนำไปใช้</h3><span class="gm-pill">5 ข้อ</span></div><p class="gm-small">พิมพ์คำช่วยให้ตรงกับสถานการณ์</p></div><div class="gm-rule gm-gap">ผ่านพื้นฐานเมื่อทำได้<br><strong>อย่างน้อยด้านละ 4 จาก 5 ข้อ</strong></div><p class="gm-note gm-gap">ช่วงนี้ไม่มีคำใบ้ เฉลยพร้อมคำอธิบายจะอยู่ท้ายชุด<br>พักแล้วกลับมาต่อได้ คำตอบแรกจะถูกเก็บไว้</p></main>'+footer(button('เริ่มตรวจความเข้าใจ '+icon('arrow-right'),'quiz-start','gm-button gm-primary gm-full')+button('กลับไปอ่านบทเรียน','restart-lesson','gm-link'));}
  function quizView(){const q=banks[s.attempt%2][s.quiz],ready=q.type==='choice'?s.selection!==null:!!s.draft.trim();return studyHeader('ลองด้วยตัวเอง',(s.quiz+1)+' / 10',s.quiz*10)+'<main class="gm-content">'+question(q,true)+'<p class="gm-small gm-gap">ดูเฉลยและคำอธิบายได้เมื่อครบทั้งชุด</p></main>'+footer(button(s.quiz===9?'บันทึกคำตอบและดูผล':'บันทึกคำตอบ · ข้อถัดไป','quiz-answer','gm-button gm-primary gm-full',ready?'':'disabled'));}
  function score(){const qs=banks[s.attempt%2],good=qs.map((q,i)=>q.type==='choice'?s.answers[i]===q.answer:normalize(s.answers[i])===q.answer);return {understand:good.slice(0,5).filter(Boolean).length,use:good.slice(5).filter(Boolean).length,good};}
  function scoreCard(label,value){return '<div class="gm-card"><p class="gm-small">'+label+'</p><p class="gm-count">'+value+'<span class="gm-small"> / 5</span></p><span class="gm-small '+(value>=4?'gm-good':'gm-warning')+'">'+(value>=4?'✓ ถึงเกณฑ์':'ฝึกเพิ่มอีกนิด')+'</span></div>';}
  function result(){const r=score(),ok=r.understand>=4&&r.use>=4,qs=banks[s.attempt%2];return '<div class="gm-result-icon '+(ok?'':'gm-repair')+'">'+icon(ok?'check':'sprout')+'</div><div class="gm-eyebrow">ผลจุดตรวจ · N + 에서</div><h1>'+(ok?'ผ่านพื้นฐานแล้ว':'มาฝึกตรงที่ยังสับสน')+'</h1><p class="gm-small gm-gap-sm">'+(ok?'คุณเลือกและสร้างรูปได้ในประโยคชุดนี้':'เราเห็นแล้วว่าควรกลับไปฝึกเรื่องไหน')+'</p><div class="gm-split gm-gap">'+scoreCard('เข้าใจและเลือกใช้',r.understand)+scoreCard('สร้างรูปและนำไปใช้',r.use)+'</div><p class="gm-small gm-gap-sm">เกณฑ์: อย่างน้อยด้านละ 4 / 5</p><div class="gm-note gm-gap">'+(ok?'สถานะ: ผ่านพื้นฐาน<br>การใช้ได้ต่อเนื่องจะตรวจด้วยประโยคใหม่ในรอบภายหลัง':'สถานะ: ยังต้องฝึก<br>บทที่เคยผ่านแล้วจะยังอยู่ เริ่มแก้เฉพาะจุดนี้ได้')+'</div><details class="gm-gap" '+(!ok?'open':'')+'><summary class="cursor-interaction">'+(ok?'ทบทวนคำตอบทั้ง 10 ข้อ':'ดูจุดที่ควรฝึกเพิ่ม')+'</summary>'+qs.map((q,i)=>ok||!r.good[i]?'<div class="gm-lesson-row"><div><p class="gm-small">ข้อ '+(i+1)+' · '+(r.good[i]?'✓ ถูกต้อง':'ยังไม่ตรงความหมาย')+'</p><p lang="ko">'+esc(q.sentence)+'</p><p class="gm-small">คำตอบของคุณ: '+esc(q.type==='choice'?q.options[s.answers[i]]||'ยังไม่ได้ตอบ':s.answers[i]||'ยังไม่ได้ตอบ')+'</p><p class="gm-small gm-gap-sm">'+q.why+'</p></div></div>':'').join('')+'</details>'+button(ok?'ดูความก้าวหน้าของฉัน':'ฝึกจุดที่ยังสับสน',ok?'progress':'repair','gm-button gm-primary gm-full gm-gap')+button('กลับหลักสูตร','library','gm-link gm-gap-sm');}
  function progress(){return '<div class="gm-eyebrow">TOPIK I · หลักสูตรนำร่อง</div><h1>ใช้ได้มากขึ้น<br>ทีละประโยค</h1><div class="gm-card gm-gap"><p class="gm-small">ผ่านพื้นฐาน</p><p class="gm-count">'+passedCount()+' <span class="gm-small">/ 16 บท</span></p>'+track(passedCount()/16*100,'จำนวนบทที่ผ่านพื้นฐาน')+'<p class="gm-small">ใช้ได้ต่อเนื่อง 2 บทจากบทที่ผ่านแล้ว</p></div><h3 class="gm-gap">บทล่าสุดของคุณ</h3><div class="gm-card gm-gap-sm"><div class="gm-row gm-between"><strong lang="ko">N + 에서</strong><span class="gm-pill '+(s.passed?'gm-pass':'gm-current')+'">'+(s.passed?'ผ่านพื้นฐาน':s.last?'ยังต้องฝึก':'พร้อมเริ่ม')+'</span></div>'+(s.last?'<div class="gm-row gm-between gm-gap-sm gm-small"><span>เข้าใจและเลือกใช้</span><strong>'+s.last.understand+' / 5</strong></div><div class="gm-row gm-between gm-gap-sm gm-small"><span>สร้างรูปและนำไปใช้</span><strong>'+s.last.use+' / 5</strong></div>':'<p class="gm-small gm-gap-sm">เรียนแล้วลองใช้เอง เพื่อดูสิ่งที่ทำได้</p>')+button(s.paused?'เรียนต่อจากที่ค้าง':'เปิดบทเรียน',s.paused?'resume':'overview','gm-link gm-gap-sm','data-id="4"')+'</div><h3 class="gm-gap">สถานะหมายถึงอะไร</h3><div class="gm-lesson-row"><span class="gm-index">'+icon('book-open')+'</span><div><h3>เรียนแล้ว</h3><p class="gm-small">อ่านและฝึกตามบทเรียนแล้ว</p></div></div><div class="gm-lesson-row"><span class="gm-index gm-done">'+icon('check')+'</span><div><h3>ผ่านพื้นฐาน</h3><p class="gm-small">ทำโจทย์ใหม่ได้เองถึงเกณฑ์ทั้งสองด้าน</p></div></div><div class="gm-lesson-row"><span class="gm-index gm-done">'+icon('check-check')+'</span><div><h3>ใช้ได้ต่อเนื่อง</h3><p class="gm-small">ยังทำได้ในประโยคใหม่เมื่อกลับมาเรียนภายหลัง</p></div></div>';}
  function settings(){return '<div class="gm-eyebrow">เรียนในแบบของคุณ</div><h1>ตั้งค่าการเรียน</h1><label class="gm-check-row"><span><strong>แสดงคำแปลไทย</strong><span class="gm-small" style="display:block">ในตัวอย่างระหว่างเรียน</span></span><input type="checkbox" id="gm-translation" '+(s.translation?'checked':'')+'></label><label class="gm-check-row"><span><strong>คำอธิบายเพิ่มเติม</strong><span class="gm-small" style="display:block">ขยายข้อสังเกตและขอบเขตการใช้</span></span><input type="checkbox" id="gm-extra" '+(s.extra?'checked':'')+'></label><div class="gm-check-row"><span><strong>การเลื่อนข้อ</strong><span class="gm-small" style="display:block">กดไปต่อเอง เพื่อมีเวลาอ่านคำอธิบาย</span></span>'+icon('hand')+'</div><div class="gm-check-row"><span><strong>ช่วงตรวจความเข้าใจ</strong><span class="gm-small" style="display:block">ไม่มีคำใบ้ · เฉลยท้ายชุด · ไม่จับเวลา</span></span>'+icon('notebook-pen')+'</div>'+button('กลับไปเรียน '+icon('arrow-right'),'today','gm-button gm-primary gm-full gm-gap');}
  function secondTrack(){return '<div class="gm-eyebrow">ระดับกลางถึงสูง</div><h1>ไวยากรณ์ TOPIK II</h1><p class="gm-small gm-gap-sm">เป้าหมายระดับสอบ 3–6</p><div class="gm-note gm-gap">ยังไม่เปิดบทเรียนใน MVP รอบนี้</div><h3 class="gm-gap">โครงหลักสูตรที่จะต่อยอด</h3>'+['คำพูดรายงานและประโยคซับซ้อน','เหตุผล ผลลัพธ์ และการอนุมาน','สมมติ เงื่อนไข และการย้อนเหตุการณ์','ภาษาเขียนและความสัมพันธ์ในย่อหน้า'].map((x,i)=>'<div class="gm-lesson-row"><span class="gm-index">'+(i+1)+'</span><span>'+x+'</span></div>').join('')+button('กลับไปเรียน TOPIK I','first-track','gm-button gm-primary gm-full gm-gap');}
  function vocab(){return '<div class="gm-eyebrow">คำศัพท์ · TOPIK '+s.track+'</div><h1>ค่อย ๆ จำได้<br>มากขึ้นทุกวัน</h1><div class="gm-card gm-gap"><p class="gm-small">ตัวอย่างจากคลังคำศัพท์</p><p class="gm-korean gm-gap-sm" lang="ko">도서관</p><p>ห้องสมุด</p><hr class="gm-divider"><p class="gm-korean" lang="ko">도서관에서 공부해요.</p><p class="gm-small gm-gap-sm">เรียนที่ห้องสมุด</p></div><div class="gm-hero"><h2>รู้คำแล้ว ลองต่อเป็นประโยค</h2><p class="gm-small gm-gap-sm">เรียนการใช้ 에서 เพื่อบอกสถานที่ทำกิจกรรม</p>'+button('เรียนไวยากรณ์ '+icon('arrow-right'),'grammar-return','gm-button gm-primary gm-full gm-gap')+'</div>';}
  function render(){applyDesign();const studying=['lesson','practice','checkintro','quiz'].includes(s.page);if(studying){screen.innerHTML=({lesson:learn,practice:practiceView,checkintro:checkIntro,quiz:quizView}[s.page])();}else{const content=s.domain==='vocab'?vocab():s.track==='II'?secondTrack():({today:home,library:library,overview:overview,result:result,progress:progress,settings:settings}[s.page]||home)();screen.innerHTML=header()+'<main class="gm-content">'+content+'</main>'+nav();}if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});}
  function announce(text){live.textContent=text;}
  function move(page){s.page=page;s.search='';s.gloss=false;render();save();announce(({today:'หน้าวันนี้',library:'คลังบทเรียน',overview:'รายละเอียดบทเรียน',lesson:'เรียนรู้',practice:'ฝึกพร้อมคำแนะนำ',checkintro:'ก่อนตรวจความเข้าใจ',quiz:'ข้อ '+(s.quiz+1)+' จาก 10',result:'ผลการเรียน',progress:'ความก้าวหน้า',settings:'ตั้งค่าการเรียน'})[page]||'');}
  function normalize(v){return String(v||'').normalize('NFC').trim();}
  function clearAnswer(){s.selection=null;s.feedback=null;s.hint=false;s.draft='';}
  function pause(){dialog.innerHTML='<h2 id="gm-dialog-title">พักตรงนี้ได้เลย</h2><p>ตำแหน่งและคำตอบที่พิมพ์ไว้จะอยู่เหมือนเดิม เมื่อกลับมาเรียนต่อ</p><div class="gm-stack gm-gap">'+button('เรียนต่อ','close-dialog','gm-button gm-primary gm-full')+button('พักไว้ กลับหน้าวันนี้','suspend','gm-button gm-full')+'</div>';dialog.showModal();}
  function refreshSubmit(){const input=root.querySelector('#gm-answer'),btn=root.querySelector('[data-act="quiz-answer"],[data-act="practice-check"]');if(input&&btn)btn.disabled=!input.value.trim();}
  root.addEventListener('click',event=>{const b=event.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
    if(a==='nav')return move(b.dataset.page);
    if(['today','library','progress'].includes(a))return move(a);
    if(a==='domain'){s.domain=b.dataset.domain;return move('today');}
    if(a==='grammar-return'){s.domain='grammar';s.track='I';s.detail=4;return move('overview');}
    if(a==='first-track'){s.track='I';return move('today');}
    if(a==='overview'){s.detail=Number(b.dataset.id)||0;return move('overview');}
    if(a==='start'||a==='restart-lesson'){s.step=0;s.paused=null;clearAnswer();return move('lesson');}
    if(a==='compare'){dialog.innerHTML='<h2 id="gm-dialog-title">สถานที่เดียวกัน คนละความหมาย</h2><div class="gm-stack gm-gap"><div><p lang="ko" class="gm-korean">학교에 있어요.</p><p>อยู่ที่โรงเรียน · ตำแหน่ง</p></div><div><p lang="ko" class="gm-korean">학교에 가요.</p><p>ไปโรงเรียน · จุดหมาย</p></div><div><p lang="ko" class="gm-korean">학교에서 공부해요.</p><p>เรียนที่โรงเรียน · สถานที่ทำกิจกรรม</p></div>'+button('เข้าใจแล้ว','close-dialog','gm-button gm-primary gm-full')+'</div>';dialog.showModal();return;}
    if(a==='lesson-next'){s.step=Math.min(2,s.step+1);return move('lesson');}
    if(a==='lesson-back'){s.step=Math.max(0,s.step-1);return move('lesson');}
    if(a==='gloss'){s.gloss=!s.gloss;render();save();return;}
    if(a==='practice-start'||a==='repair'){s.practice=0;s.paused=null;clearAnswer();return move('practice');}
    if(a==='choose'){s.selection=Number(b.dataset.value);render();save();root.querySelector('[data-value="'+s.selection+'"]')?.focus({preventScroll:true});return;}
    if(a==='hint'){s.hint=true;render();save();announce('คำใบ้: '+practice[s.practice].hint);return;}
    if(a==='practice-check'){const q=practice[s.practice];if((q.type==='choice'&&s.selection===null)||(q.type==='type'&&!s.draft.trim()))return;const correct=q.type==='choice'?s.selection===q.answer:normalize(s.draft)===q.answer;s.feedback=correct?'correct':'incorrect';render();save();return;}
    if(a==='practice-next'){if(s.practice===2){clearAnswer();return move('checkintro');}s.practice++;clearAnswer();return move('practice');}
    if(a==='quiz-start'){if(s.answers.length===10)s.attempt++;s.quiz=0;s.answers=[];clearAnswer();return move('quiz');}
    if(a==='quiz-answer'){const q=banks[s.attempt%2][s.quiz];if((q.type==='choice'&&s.selection===null)||(q.type==='type'&&!s.draft.trim()))return;s.answers[s.quiz]=q.type==='choice'?s.selection:normalize(s.draft);if(s.quiz===9){const r=score();s.last={understand:r.understand,use:r.use};if(r.understand>=4&&r.use>=4)s.passed=true;s.paused=null;clearAnswer();return move('result');}s.quiz++;clearAnswer();return move('quiz');}
    if(a==='pause')return pause();
    if(a==='close-dialog')return dialog.close();
    if(a==='suspend'){s.paused=s.page;dialog.close();return move('today');}
    if(a==='resume'){const dest=s.paused||'lesson';s.paused=null;return move(dest);}
    if(a==='speak'&&typeof speechSynthesis!=='undefined'){const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko')&&v.localService);if(!voice)return;const u=new SpeechSynthesisUtterance(b.dataset.text);u.lang='ko-KR';u.voice=voice;u.rate=.85;speechSynthesis.cancel();speechSynthesis.speak(u);}
  });
  root.addEventListener('input',e=>{if(e.target.id==='gm-answer'){s.draft=e.target.value;refreshSubmit();save();}if(e.target.id==='gm-search'){s.search=e.target.value;root.querySelector('#gm-results').innerHTML=catalogResults();if(globalThis.lucide)lucide.createIcons({attrs:{width:18,height:18}});save();}});
  root.addEventListener('change',e=>{if(e.target.id==='gm-course'){s.track=e.target.value;move('today');}if(e.target.id==='gm-translation'){s.translation=e.target.checked;save();}if(e.target.id==='gm-extra'){s.extra=e.target.checked;save();}});
  root.addEventListener('compositionstart',()=>{composing=true;});root.addEventListener('compositionend',()=>{composing=false;});
  root.addEventListener('keydown',e=>{if(e.target.id==='gm-answer'&&e.key==='Enter'){e.preventDefault();if(e.isComposing||composing||e.keyCode===229)return;root.querySelector('[data-act="quiz-answer"],[data-act="practice-check"]')?.click();}});
  restore(window.openai&&window.openai.widgetState);render();
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const tweak=new Tweak({container:root.querySelector('.gm-phone'),onChange:()=>{applyDesign();save();}});tweak.addSlider(design,'fontSize',{label:'ขนาดตัวอักษร',min:15,max:19,step:1,unit:'px',reference:'--gm-size'});tweak.addSlider(design,'radius',{label:'ความโค้งของการ์ด',min:12,max:24,step:2,unit:'px',reference:'--gm-radius'});}
})();
</script>
